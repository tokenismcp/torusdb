name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Everything needed to build and test lives in this repository (Apache-2.0).

jobs:
  parser:
    name: parser (zero deps) · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install pytest ./parser
      - run: pytest parser/tests -q

  custody:
    name: threshold custody (zero deps) · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install pytest "py_ecc>=6,<9"
      - name: custodian host install needs no engine core
        run: |
          pip install --no-deps ./drivers/python
          python -c "import sys, torussql.custody; assert 'torusdb_core' not in sys.modules"
      - run: pytest tests/test_custody.py -q -p no:cacheprovider

  python:
    name: python suites · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install pytest "py_ecc>=6,<9"
      - run: pip install mclbn256 || echo "native FHE back end unavailable on this platform"
      - name: tests
        run: pytest -q -p no:cacheprovider

  wheels:
    name: build + smoke-test installed wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install build
          mkdir wh
          for d in parser core drivers/python server; do
            python -m build --wheel --outdir wh "$d"
          done
          python -m venv /tmp/v && /tmp/v/bin/pip install --find-links wh torusdb-server
      - name: smoke (installed, outside the source tree)
        working-directory: /tmp
        run: |
          /tmp/v/bin/torusdb-server --port 18533 &
          sleep 2
          /tmp/v/bin/python - <<'PY'
          import torussql
          c = torussql.connect("127.0.0.1", 18533)
          c.execute("CREATE TABLE t (id INT PLAIN, v INT ENC)")
          c.cursor().executemany("INSERT INTO t (id, v) VALUES (%s, %s)", [(1, 4), (2, 5)])
          assert c.execute("SELECT SUM(v) FROM t").rows == [[9]], "wrong result"
          print("smoke ok", torussql.__version__)
          PY
      - name: smoke - disk primary + replica + shell (installed wheels)
        working-directory: /tmp
        run: |
          mkdir -p smoke && cd smoke && echo "admin:ci-admin-token-0123456789" > tokens
          export T=ci-admin-token-0123456789
          /tmp/v/bin/torusdb-server --port 18601 --db p.db --storage disk --token-file tokens &
          sleep 2
          /tmp/v/bin/torusdb-server --port 18602 --db r.db --token-file tokens \
              --replica-of 127.0.0.1:18601 --repl-token-env T &
          sleep 3
          /tmp/v/bin/torussql -p 18601 --token-env T --trust-server-schema \
              -c "CREATE TABLE t (id INT PLAIN, name STR PLAIN)" \
              -c "INSERT INTO t (id, name) VALUES (1, 'alice')"
          sleep 2
          /tmp/v/bin/torussql -p 18602 --token-env T --trust-server-schema \
              -c "SELECT name FROM t WHERE name LIKE 'a%'" | grep -q alice
      - uses: actions/upload-artifact@v4
        with: { name: wheels, path: wh/*.whl }

  typescript:
    name: typescript driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "py_ecc>=6,<9" ./parser ./core ./drivers/python ./server
      - working-directory: drivers/typescript
        env:
          TORUSDB_PYTHON: python
          TORUSDB_REQUIRE_INTEGRATION: "1"
        run: |
          npm ci
          npm run typecheck
          npm test
          npm pack --dry-run

  rust:
    name: rust driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "py_ecc>=6,<9" ./parser ./core ./drivers/python ./server
      - working-directory: drivers/rust
        env:
          TORUSDB_PYTHON: python
          TORUSDB_REQUIRE_INTEGRATION: "1"
        run: |
          cargo test
          cargo test --features tls
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features tls -- -D warnings
          cargo package --allow-dirty

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --load -f server/Dockerfile -t torusdb-server:ci .
      - name: refuses unauthenticated non-loopback bind
        run: |
          out=$(docker run --rm torusdb-server:ci 2>&1 || true)
          echo "$out" | grep -q "refusing to listen"
      - name: healthy with a token file
        run: |
          mkdir -p /tmp/s && echo "admin:ci-admin-token-0123456789" > /tmp/s/tokens
          docker run -d --name tdb -v /tmp/s:/secrets:ro torusdb-server:ci --token-file /secrets/tokens
          for i in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' tdb)" = healthy ] && exit 0; sleep 2
          done
          docker logs tdb; exit 1

  bench:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "py_ecc>=6,<9"
      - run: |
          python bench/net_bench.py --rows 2000
          python bench/tpch.py --rows 500

  publish-python:
    name: publish Python packages (PyPI, trusted publishing)
    needs: [parser, custody, python, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install build
          # dependency order: parser -> core -> driver -> server
          for d in parser core drivers/python server; do python -m build --outdir dist "$d"; done
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist }

  publish-npm:
    name: publish @torusdb/driver
    needs: [typescript, publish-python]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", registry-url: "https://registry.npmjs.org" }
      - working-directory: drivers/typescript
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          npm ci
          npm publish --access public --provenance

  publish-crate:
    name: publish torusdb crate
    needs: [rust]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: drivers/rust
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
        run: cargo publish
