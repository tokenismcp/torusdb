name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The proprietary engine (ec_fhe_engine + ec_fhe_query) is not in this repo.
# Jobs marked "engine" check it out from a private repository using:
#   vars.ENGINE_REPO   e.g. j1729labs/torusdb-engine
#   secrets.ENGINE_TOKEN  a read-only deploy token for that repository
# Fork PRs do not receive secrets, so those run the engine-free jobs only.

jobs:
  parser:
    name: parser (engine-free) · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install pytest ./parser
      - run: pytest parser/tests -q

  python:
    name: python suites (engine) · py${{ matrix.python }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ENGINE_REPO }}
          token: ${{ secrets.ENGINE_TOKEN }}
          path: _engine
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install pytest "py_ecc>=6,<9"
      - name: tests
        env:
          TORUSDB_ENGINE_DIR: ${{ github.workspace }}/_engine
        run: pytest -q -p no:cacheprovider
      - name: engine suites
        env:
          TORUSDB_ENGINE_DIR: ${{ github.workspace }}/_engine
        run: pytest _engine/ec_fhe_engine _engine/ec_fhe_query -q -p no:cacheprovider

  wheels:
    name: build + smoke-test installed wheels
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ vars.ENGINE_REPO }}", token: "${{ secrets.ENGINE_TOKEN }}", path: _engine }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install build
          mkdir wh
          for d in _engine/ec_fhe_engine _engine/ec_fhe_query parser drivers/python server; do
            python -m build --wheel --outdir wh "$d"
          done
          python -m venv /tmp/v && /tmp/v/bin/pip install --find-links wh torusdb-server
      - name: smoke (installed, outside the source tree)
        working-directory: /tmp
        run: |
          /tmp/v/bin/torusdb-server --port 18533 &
          sleep 2
          /tmp/v/bin/python - <<'PY'
          import torussql
          c = torussql.connect("127.0.0.1", 18533)
          c.execute("CREATE TABLE t (id INT PLAIN, v INT ENC)")
          c.cursor().executemany("INSERT INTO t (id, v) VALUES (%s, %s)", [(1, 4), (2, 5)])
          assert c.execute("SELECT SUM(v) FROM t").rows == [[9]], "wrong result"
          print("smoke ok", torussql.__version__)
          PY
      - uses: actions/upload-artifact@v4
        with: { name: wheels, path: wh/*.whl }

  typescript:
    name: typescript driver
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ vars.ENGINE_REPO }}", token: "${{ secrets.ENGINE_TOKEN }}", path: _engine }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "py_ecc>=6,<9"
      - working-directory: drivers/typescript
        env:
          TORUSDB_ENGINE_DIR: ${{ github.workspace }}/_engine
          TORUSDB_PYTHON: python
        run: |
          npm ci
          npm run typecheck
          npm test
          npm pack --dry-run

  rust:
    name: rust driver
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ vars.ENGINE_REPO }}", token: "${{ secrets.ENGINE_TOKEN }}", path: _engine }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "py_ecc>=6,<9"
      - working-directory: drivers/rust
        env:
          TORUSDB_ENGINE_DIR: ${{ github.workspace }}/_engine
          TORUSDB_PYTHON: python
        run: |
          cargo test
          cargo test --features tls
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features tls -- -D warnings
          cargo package --allow-dirty

  docker:
    name: docker image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ vars.ENGINE_REPO }}", token: "${{ secrets.ENGINE_TOKEN }}", path: _engine }
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --load --build-context engine=_engine -f server/Dockerfile -t torusdb-server:ci .
      - name: refuses unauthenticated non-loopback bind
        run: |
          out=$(docker run --rm torusdb-server:ci 2>&1 || true)
          echo "$out" | grep -q "refusing to listen"
      - name: healthy with a token file
        run: |
          mkdir -p /tmp/s && echo "admin:ci-admin-token-0123456789" > /tmp/s/tokens
          docker run -d --name tdb -v /tmp/s:/secrets:ro torusdb-server:ci --token-file /secrets/tokens
          for i in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' tdb)" = healthy ] && exit 0; sleep 2
          done
          docker logs tdb; exit 1

  bench:
    name: benchmark smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ vars.ENGINE_REPO }}", token: "${{ secrets.ENGINE_TOKEN }}", path: _engine }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "py_ecc>=6,<9"
      - env: { TORUSDB_ENGINE_DIR: "${{ github.workspace }}/_engine" }
        run: |
          python bench/net_bench.py --rows 2000
          python bench/tpch.py --rows 500

  publish-parser:
    name: publish torussql-parser (PyPI, trusted publishing)
    needs: [parser, python]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build parser
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: parser/dist }

  publish-npm:
    name: publish @torusdb/driver
    needs: [typescript]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", registry-url: "https://registry.npmjs.org" }
      - working-directory: drivers/typescript
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          npm ci
          npm publish --access public --provenance

  publish-crate:
    name: publish torusdb crate
    needs: [rust]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: drivers/rust
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }
        run: cargo publish
