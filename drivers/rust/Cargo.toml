[package]
name = "torusdb"
version = "0.6.2"
edition = "2021"
license = "Apache-2.0"
description = "No-key TorusDB client — the server holds no keys and never decrypts"
authors = ["J1729 Labs <jlabsrd@gmail.com>"]
homepage = "https://github.com/tokenismcp/torusdb"
repository = "https://github.com/tokenismcp/torusdb"
documentation = "https://docs.rs/torusdb"
readme = "README.md"
keywords = ["torusdb", "homomorphic", "encrypted-database", "privacy", "no-key"]
categories = ["database", "cryptography"]
include = ["src/**/*", "examples/**/*", "README.md", "LICENSE", "NOTICE", "Cargo.toml"]

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde_json = "1"
rand = "0.8"
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }

[features]
default = []
# TLS (rustls + ring). Off by default; certificates AND hostnames are verified
# unless ConnectOptions::tls_insecure is set explicitly.
tls = ["dep:rustls", "dep:webpki-roots"]

[[example]]
name = "demo"
path = "examples/demo.rs"

# The FHE column arithmetic (BN254 on num-bigint) is ~10x slower unoptimised; keep `cargo test`
# practical without `--release`. Profiles of dependencies are ignored by crates.io consumers.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
