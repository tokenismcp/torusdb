[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torusdb-server"
version = "0.5.0"
description = "Keyless TorusDB server — evaluates encrypted queries over blinded scalars; holds no key material"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "J1729 Labs", email = "jlabsrd@gmail.com" }]
keywords = ["torusdb", "torussql", "homomorphic-encryption", "encrypted-database", "server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Security :: Cryptography",
]
# torussql supplies the wire codec/framing; torusdb-core the keyless engine.
dependencies = ["torussql==0.5.0", "torusdb-core==0.5.0"]

[project.optional-dependencies]
fhe = ["torusdb-core[fhe]==0.5.0"]
fhe-native = ["torusdb-core[fhe-native]==0.5.0"]

[project.scripts]
torusdb-server = "nokey_server:main"

[tool.setuptools]
py-modules = ["nokey_server", "durability", "replication"]
