[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torusdb-server"
version = "0.6.2"
description = "Keyless TorusDB server — evaluates encrypted queries over blinded scalars; holds no key material"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "J1729 Labs", email = "jlabsrd@gmail.com" }]
keywords = ["torusdb", "torussql", "homomorphic-encryption", "encrypted-database", "server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Security :: Cryptography",
]
# torussql supplies the wire codec/framing; torusdb-core the keyless engine.
dependencies = ["torussql==0.6.2", "torusdb-core==0.6.2"]

[project.optional-dependencies]
fhe = ["torusdb-core[fhe]==0.6.2"]
fhe-native = ["torusdb-core[fhe-native]==0.6.2"]

[project.urls]
Homepage      = "https://torusdb.io"
Repository    = "https://github.com/tokenismcp/torusdb"
Documentation = "https://github.com/tokenismcp/torusdb/blob/main/docs/GETTING_STARTED.md"
"Bug Tracker" = "https://github.com/tokenismcp/torusdb/issues"
Discussions   = "https://github.com/tokenismcp/torusdb/discussions"
Changelog     = "https://github.com/tokenismcp/torusdb/blob/main/CHANGELOG.md"
Security      = "https://github.com/tokenismcp/torusdb/blob/main/SECURITY.md"
Funding       = "https://github.com/sponsors/tokenismcp"

[project.scripts]
torusdb-server = "nokey_server:main"

[tool.setuptools]
py-modules = ["nokey_server", "durability", "replication"]
