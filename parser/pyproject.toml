[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "torussql-parser"
version = "0.5.0"
description = "Open parser and static validator for the TorusSQL dialect"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["torussql", "torusdb", "sql", "homomorphic-encryption", "parser"]
dependencies = []                    # zero runtime dependencies — engine-free

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["torussql_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
