[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torusdb-core"
version = "0.6.2"
description = "Keyless TorusDB engine: planner, blinding client and storage over the no-key delegation protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "J1729 Labs", email = "jlabsrd@gmail.com" }]
keywords = ["torusdb", "torussql", "encrypted-database", "no-key-delegation", "sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Security :: Cryptography",
]
dependencies = ["torussql-parser==0.6.2"]       # pure Python

[project.optional-dependencies]
fhe = ["py_ecc>=6.0.0,<9.0.0"]                  # FHE columns (pairing arithmetic)
fhe-native = ["py_ecc>=6.0.0,<9.0.0", "mclbn256>=1.3"]   # ... ~150x faster (native pairings)

[project.urls]
Homepage      = "https://torusdb.io"
Repository    = "https://github.com/tokenismcp/torusdb"
Documentation = "https://github.com/tokenismcp/torusdb/blob/main/docs/GETTING_STARTED.md"
"Bug Tracker" = "https://github.com/tokenismcp/torusdb/issues"
Discussions   = "https://github.com/tokenismcp/torusdb/discussions"
Changelog     = "https://github.com/tokenismcp/torusdb/blob/main/CHANGELOG.md"
Security      = "https://github.com/tokenismcp/torusdb/blob/main/SECURITY.md"
Funding       = "https://github.com/sponsors/tokenismcp"

[tool.setuptools]
packages = ["torusdb_core"]
